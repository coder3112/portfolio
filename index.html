<title>Naitik Mundra: Mechatronics Portfolio</title>
<meta name="description" content="Mechanical engineering and mechatronics portfolio: eCVT, swarm robotics, driven pulley, and ME2110 drivetrain.">
<style>
  :root { --navy:#003057; --gold:#857437; --tint:#E6EEF6; --text:#003057; --muted:#4A5560; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color:var(--text); background:#fff; line-height:1.5; }
  header { background:var(--tint); padding:32px 16px; }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px; }
  h1 { margin:0 0 4px; font-size:clamp(1.6rem,5vw,2.4rem); letter-spacing:.02em; }
  .sub { margin:0; color:var(--muted); font-weight:700; font-size:.85rem; letter-spacing:.06em; }
  main { padding:32px 0 48px; }
  p.lead { font-size:1.05rem; max-width:62ch; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin:24px 0; }
  a.btn { display:inline-block; padding:12px 20px; border:2px solid var(--navy); color:var(--navy); text-decoration:none; font-weight:700; font-size:.95rem; }
  a.btn.primary { background:var(--navy); color:#fff; }
  a.btn:hover, a.btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  object { width:100%; height:80vh; min-height:480px; border:1px solid #CBD2D9; }
  .fallback { padding:16px; }
  footer { border-top:1px solid #CBD2D9; padding:20px 0; font-size:.85rem; color:var(--muted); }
  footer a { color:var(--navy); }
</style>
</head>
<body>
<header>

    <h1>NAITIK MUNDRA</h1>

<main class="wrap">
  <p class="lead">I design in CAD, verify in FEA, then prototype and machine it myself. I wire and calibrate the sensors and tune the controls.</p>
  <div class="actions">
    <a class="btn primary" href="Naitik_Mundra_Portfolio.pdf">Open portfolio (PDF)</a>
    <a class="btn" href="Naitik_Mundra_Portfolio.pdf" download>Download</a>
  </div>
  <object data="Naitik_Mundra_Portfolio.pdf#view=FitH" type="application/pdf" aria-label="Portfolio PDF preview">

</main>
